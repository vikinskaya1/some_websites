<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Media Hub - Музыка</title>
    <link rel="stylesheet" href="m_styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@400&display=swap"
        rel="stylesheet">
</head>

<body data-page="music">
    <main>

        <!-- Новый альбом -->
        <section id="latestAlbum" class="music-section">
            <h2 class="latest-title">🔥 Новый альбом Linkin Park</h2>
            <div class="latest-album-container"></div>
        </section>

        <!-- Концерты -->
        <section id="concertsContainer" class="music-section">
            <h2>Ближайшие концерты</h2>
            <div class="card-container"></div>
        </section>

        <!-- Артисты -->
        <section id="artistsContainer" class="music-section">
            <h2>Исполнители и группы</h2>
            <div class="card-container"></div>
        </section>

        <!-- Альбомы -->
        <section id="albumsContainer" class="music-section">
            <h2>Альбомы</h2>
            <div class="card-container"></div>
        </section>

    </main>
</body>

<script src="music.js"></script>

</html>
